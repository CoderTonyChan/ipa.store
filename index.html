<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPA OTA安装中心</title>
  <style>
    *{box-sizing:border-box;font-family:system-ui,-apple-system}
    body{max-width:620px;margin:24px auto;padding:0 16px;background:#f8f9fa}
    h2{text-align:center;color:#222}
    .node-select-wrap{background:#fff;padding:14px;border-radius:10px;margin-bottom:16px}
    label{font-weight:500}
    #nodeSelect{padding:6px 8px;font-size:16px;width:100%;margin-top:8px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;margin:12px 0}
    .card h3{margin:0 0 6px 0;color:#111}
    .card p{color:#555;margin:4px 0 12px 0;font-size:14px}
    button{padding:9px 14px;margin:4px;border:none;border-radius:6px;cursor:pointer;font-size:15px}
    .btn-ota{background:#2563eb;color:#fff}
    .btn-download{background:#10b981;color:#fff}
    .tip{color:#dc2626;font-size:13px;margin-top:4px}
  </style>
</head>
<body>
<h2>iOS IPA OTA安装中心</h2>
<div class="node-select-wrap">
  <label>选择下载网点：</label>
  <select id="nodeSelect"></select>
</div>

<div id="appContainer"></div>

<script src="./app.config.js"></script>
<script>
  const container = document.getElementById('appContainer');
  const nodeSelect = document.getElementById('nodeSelect');
  const pageBaseUrl = window.location.origin;

  // 渲染下拉网点选项
  function renderNodeOptions() {
    nodeSelect.innerHTML = "";
    nodeList.forEach(node => {
      const opt = document.createElement("option");
      opt.value = node.key;
      opt.textContent = node.label;
      nodeSelect.appendChild(opt);
    });
  }

  function renderApps() {
    container.innerHTML = '';
    const nodeKey = nodeSelect.value;
    // 根据key查找当前网点配置
    const currentNode = nodeList.find(n => n.key === nodeKey);
    const prefix = currentNode.prefix;

    appList.forEach(app => {
      const card = document.createElement('div');
      card.className = 'card';
      const plistBase = `${pageBaseUrl}/${app.bundleId}-${app.version}`;
      const plistUrl = `${plistBase}-${nodeKey}.plist`;
      card.innerHTML = `
      <h3>${app.title} v${app.version}</h3>
      <p>BundleID：${app.bundleId}</p>
      <button class="otaInstallBtn btn-ota" data-plist="${plistUrl}">iOS OTA安装</button>
      <a target="_blank">
        <button class="directDownloadBtn btn-download" data-ipa="${app.ipaDownloadUrl}">直接下载IPA</button>
      </a>
      <p class="tip">⚠️ 仅Safari浏览器支持OTA，微信内置浏览器无法安装</p>
    `;
      container.appendChild(card);
    })
    bindEvents(prefix);
  }

  function bindEvents(prefix) {
    document.querySelectorAll('.otaInstallBtn').forEach(btn => {
      btn.onclick = function() {
        const plist = this.dataset.plist;
        window.location.href = `itms-services://?action=download-manifest&url=${encodeURIComponent(plist)}`;
      }
    })

    document.querySelectorAll('.directDownloadBtn').forEach(btn => {
      const link = btn.parentElement;
      const rawIpa = btn.dataset.ipa;
      const finalIpaUrl = prefix ? prefix + rawIpa : rawIpa;
      link.href = finalIpaUrl;
    })
  }

  nodeSelect.onchange = renderApps;
  renderNodeOptions();
  renderApps();
</script>
</body>
</html>
